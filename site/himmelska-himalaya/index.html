<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Himmelska Himalaya · Annapurna Circuit trail companion</title>
  <meta name="description" content="A day-by-day companion for the Annapurna Circuit in Nepal: a 3D relief of the route, every stage, altitude and acclimatisation, permits, packing and a checklist that works without signal.">
  <meta name="theme-color" content="#0a1217">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Annapurna">
  <meta name="format-detection" content="telephone=no">
  <link rel="preload" href="assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/journey" aria-label="Himmelska Himalaya, start">
      <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 19 10.5 4l4.2 6.6L18 6l11 13z"/><path d="m7.6 8.6 2.9 2.2 2.5-2.6"/>
      </svg>
      <span>Annapurna <span class="sub">Circuit <span class="slash">/</span> Nepal</span></span>
    </a>
    <div class="topbar-actions">
      <button class="topbtn is-warn" type="button" id="btn-sos">Emergency</button>
      <button class="topbtn is-accent wide-only" type="button" id="btn-dates"><span id="dates-label">Set your dates</span></button>
      <button class="topbtn wide-only" type="button" id="btn-offline" title="Offline status"><i class="dot" id="offline-dot"></i><span id="offline-label">Offline: checking</span></button>
      <button class="topbtn wide-only" type="button" id="btn-theme"><span>Theme:&nbsp;</span><span id="theme-label">Auto</span></button>
      <button class="topbtn wide-only" type="button" id="btn-about"><span>About</span></button>
      <button class="topbtn small-only" type="button" id="btn-menu"><i class="dot" data-offline-dot></i><span>Menu</span></button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-today" data-view="today" hidden></section>
    <section class="view" id="view-map" data-view="map" hidden></section>
    <section class="view" id="view-days" data-view="days" hidden></section>
    <section class="view" id="view-altitude" data-view="altitude" hidden></section>
    <section class="view" id="view-prepare" data-view="prepare" hidden></section>
    <section class="view" id="view-journey" data-view="journey" hidden></section>
    <footer class="footer wrap">
      <p>A planning companion, not a guide service. Trail, permit and weather conditions change: confirm them locally.</p>
      <p>No tracking, no account. Your data stays on this phone.</p>
    </footer>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a class="tab" href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      Today
    </a>
    <a class="tab" href="#/map" data-tab="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
      Map
    </a>
    <a class="tab" href="#/days" data-tab="days">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      Days
    </a>
    <a class="tab" href="#/altitude" data-tab="altitude">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>
      Altitude
    </a>
    <a class="tab" href="#/prepare" data-tab="prepare">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="m9 10 2 2 4-4M9 16h6"/></svg>
      Prepare
    </a>
  </nav>

  <dialog class="sheet" id="day-dialog" aria-labelledby="day-dialog-title"></dialog>
  <dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;max-width:60ch">This companion needs JavaScript to draw the relief, the altitude chart and the checklists.</p>
  </noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
